tosca_definitions_version: tosca_simple_yaml_1_0

metadata:
  template_name: AdminAutoPowerResource
  template_author: Quali SE
  template_version: 1.0.0
  template_icon: shell-icon.png

description: >
  Admin Only Resource Handler shell.

imports:
  - cloudshell_standard: cloudshell_admin_only_custom_service_standard_1_0_0.yaml

node_types:

  vendor.resource.AdminAutoPowerResource:
    derived_from: cloudshell.nodes.AdminOnlyCustomService
    properties:
     Service Categories:
       type: list
       default: [Admin-Services]    
    artifacts:
      icon:
        file: shell-icon.png
        type: tosca.artifacts.File
      driver:
        file: AdminAutoPowerResource.zip
        type: tosca.artifacts.File
